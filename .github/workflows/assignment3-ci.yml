name: Assignment 3 CI

on:
  push:
    branches: [assignment3-development, main]
    paths:
      - "assignment3/**"
      - ".github/workflows/assignment3-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "assignment3/**"
      - ".github/workflows/assignment3-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
